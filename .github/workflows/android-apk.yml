name: FnO Pulse Android APK and emulator verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms android --project-name fno_pulse --org com.alok .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Flutter static analysis
        run: flutter analyze
      - name: Run Flutter widget tests
        run: flutter test test
      - name: Build Android APK (debug installable)
        run: flutter build apk --debug
      - name: Build Android APK (release candidate)
        run: flutter build apk --release
      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: FnO-Pulse-Android-APKs
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  emulator-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms android --project-name fno_pulse --org com.alok .
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Enable hardware acceleration
        run: |
          sudo sh -c 'echo "KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: flutter test integration_test/smoke_test.dart -d emulator-5554
