name: FnO Pulse iPhone and Web verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone-simulator:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS app
        run: flutter create --platforms=ios --project-name fno_pulse --org com.alok .
      - name: Get packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget tests
        run: flutter test test
      - name: Build iPhone simulator app without signing
        run: flutter build ios --simulator --debug
      - name: Package simulator app
        shell: bash
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/FnO-Pulse-iPhone-Simulator.app.zip
      - name: Upload iPhone simulator bundle
        uses: actions/upload-artifact@v4
        with:
          name: FnO-Pulse-iPhone-Simulator-Build
          path: build/ios/FnO-Pulse-iPhone-Simulator.app.zip
          if-no-files-found: error
      - name: Select available iPhone simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, os, sys
          data = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"], text=True))
          choices = [(runtime,d["name"],d["udid"]) for runtime,devices in data.get("devices",{}).items() for d in devices if d.get("isAvailable",True) and "iPhone" in d.get("name","")]
          print("Available iPhone simulators:", choices)
          if not choices: sys.exit("No available iPhone simulator")
          runtime,name,uuid = sorted(choices,reverse=True)[0]
          print("Selected:", runtime, name, uuid)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f: f.write(f"IOS_SIM_ID={uuid}\n")
          PY
      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot "$IOS_SIM_ID"
          xcrun simctl bootstatus "$IOS_SIM_ID" -b
          flutter devices
      - name: Run real iOS simulator navigation test
        run: flutter test integration_test/smoke_test.dart -d "$IOS_SIM_ID"

  web-safari-compatible:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter web project
        run: flutter create --platforms=web --project-name fno_pulse --org com.alok .
      - name: Get packages
        run: flutter pub get
      - name: Web compile
        run: flutter build web --release --base-href /F-O-pulse-/
      - name: Upload mobile browser website
        uses: actions/upload-artifact@v4
        with:
          name: FnO-Pulse-iPhone-Android-Web
          path: build/web/
          if-no-files-found: error
